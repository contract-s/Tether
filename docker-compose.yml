# The whole system: `make stack` (docker compose up -d --build), then open
#   http://localhost:8000/dashboard/reviews   review queue (+ memory, traces, replay)
#   http://localhost:16686                    Jaeger
# For local development, `make up` starts only the infrastructure and `make api`
# runs the API on your machine against it.

x-app: &app
  build: .
  image: agentorch:latest
  env_file:
    - path: .env # ANTHROPIC_API_KEY and any overrides
      required: false
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://agentorch:agentorch@postgres:5432/agentorch
    REDIS_URL: redis://redis:6379/0
    CHROMA_HOST: chromadb
    CHROMA_PORT: "8000"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    TASK_RUNNER: celery
    WORKSPACE_DIR: /app/data/workspace
  volumes:
    - workspace:/app/data/workspace
    - modelcache:/home/app/.cache/chroma
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    chromadb: { condition: service_started }
  restart: unless-stopped

services:
  api:
    <<: *app
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

  worker:
    <<: *app
    command: ["celery", "-A", "agentorch.workers", "worker", "--loglevel=info", "--concurrency=4"]
    # code_exec starts throwaway sandbox containers, so the worker talks to the host's
    # Docker. Access to the socket is root-equivalent on the host: the worker runs as root
    # and is the only service that gets it. The sandboxes themselves are locked down.
    user: root
    volumes:
      - workspace:/app/data/workspace
      - modelcache:/home/app/.cache/chroma
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentorch
      POSTGRES_PASSWORD: agentorch
      POSTGRES_DB: agentorch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentorch"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:1.5.9 # keep in step with the chromadb client in uv.lock
    ports: ["8001:8000"]
    volumes: [chromadata:/data]

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC

volumes:
  pgdata:
  chromadata:
  workspace:
  modelcache:
