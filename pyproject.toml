[project]
name = "agentorch"
version = "0.1.0"
description = "Multi-agent orchestration system with tool use, persistent memory, and human-in-the-loop escalation."
readme = "README.md"
authors = [{ name = "Sai Siddharth Kodali" }]
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # LLM providers
    "anthropic>=0.40",
    "openai>=1.50",
    # Tools
    "mcp>=1.0",
    "httpx>=0.27",
    # Memory / persistence
    "chromadb>=0.5",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # Async execution
    "celery>=5.4",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Observability
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "structlog>=24.4",
    "langgraph-checkpoint-postgres>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "fakeredis>=2.40.0",
]
ui = [
    "streamlit>=1.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentorch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Claude API (opt in with AGENTORCH_LIVE=1)"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
