<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentOrch Memory</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e3e2dd; --accent: #2f5bd3; --danger: #c0392b; --bar: #d9e2fb;
    --chip: #efeee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9b9a94;
      --border: #33322e; --accent: #7b9bff; --danger: #ff7b6b; --bar: #2b3a66;
      --chip: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); margin: 2px 0 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, button { font: inherit; padding: 6px 10px; border-radius: 6px;
                   border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
          padding: 8px 12px; min-width: 110px; }
  .stat b { display: block; font-size: 18px; }
  .stat span { color: var(--muted); font-size: 12px; }
  #status { color: var(--muted); min-height: 20px; margin: 8px 0; white-space: pre-wrap; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
          overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border);
           vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .kind { display: inline-block; padding: 1px 8px; border-radius: 999px;
          background: var(--chip); font-size: 12px; white-space: nowrap; }
  .meter { width: 90px; height: 6px; background: var(--chip); border-radius: 3px;
           overflow: hidden; margin-top: 4px; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--muted); }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>What AgentOrch remembers</h1>
      <p class="sub">Long-term memories per user, most important first.</p>
    </div>
    <div class="controls">
      <label for="user">User</label>
      <select id="user"></select>
      <button id="consolidate" title="Merge near-duplicate memories (calls Claude)">Consolidate</button>
      <button id="expire" title="Delete memories whose importance has decayed">Expire stale</button>
      <button id="forget" class="danger" title="Delete every memory for this user">Forget user</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div id="status" role="status"></div>
  <div class="card"><table>
    <thead><tr>
      <th>Kind</th><th>Memory</th><th>Importance</th><th>Used</th>
      <th>Last used</th><th>Merged</th><th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>

<script>
// Memory text comes from agents that read the web, so it is only ever inserted as text.
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

function ago(seconds) {
  const s = Date.now() / 1000 - seconds;
  if (s < 90) return "just now";
  if (s < 5400) return `${Math.round(s / 60)} min ago`;
  if (s < 129600) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} days ago`;
}

function setStatus(text) { $("status").textContent = text; }

async function loadUsers(selected) {
  const users = await api("/users");
  const select = $("user");
  select.replaceChildren(...users.map((u) =>
    el("option", { value: u.user_id, textContent: `${u.user_id} (${u.memories})` })));
  if (!users.length) select.append(el("option", { value: "", textContent: "no users yet" }));
  if (selected && users.some((u) => u.user_id === selected)) select.value = selected;
  for (const id of ["consolidate", "expire", "forget"]) $(id).disabled = !users.length;
  await loadMemories();
}

async function loadMemories() {
  const user = $("user").value;
  const rows = $("rows");
  if (!user) {
    rows.replaceChildren(el("tr", {}, el("td", { colSpan: 7, className: "empty",
      textContent: "No memories yet. Run a task to create some." })));
    $("stats").replaceChildren();
    return;
  }
  const memories = await api(`/users/${encodeURIComponent(user)}/memories`);
  const kinds = {};
  memories.forEach((m) => (kinds[m.kind] = (kinds[m.kind] || 0) + 1));
  $("stats").replaceChildren(
    el("div", { className: "stat" }, el("b", { textContent: memories.length }),
       el("span", { textContent: "memories" })),
    ...Object.entries(kinds).map(([k, n]) => el("div", { className: "stat" },
       el("b", { textContent: n }), el("span", { textContent: k.replace("_", " ") }))));

  rows.replaceChildren(...memories.map((m) => {
    const pct = Math.round((m.importance || 0) * 100);
    const del = el("button", { textContent: "Delete", className: "danger" });
    del.onclick = async () => {
      if (!confirm("Delete this memory?")) return;
      await api(`/memories/${encodeURIComponent(m.id)}`, { method: "DELETE" });
      setStatus("Deleted 1 memory.");
      loadUsers(user);
    };
    return el("tr", {},
      el("td", {}, el("span", { className: "kind", textContent: m.kind.replace("_", " ") })),
      el("td", { textContent: m.text }),
      el("td", { className: "num" }, `${pct}%`,
         el("div", { className: "meter" }, el("i", { style: `width:${pct}%` }))),
      el("td", { className: "num", textContent: `${m.access_count}×` }),
      el("td", { className: "num muted", textContent: ago(m.last_accessed_at) }),
      el("td", { className: "num muted",
                 textContent: m.consolidated_from > 1 ? `${m.consolidated_from} → 1` : "" }),
      el("td", {}, del));
  }));
  if (!memories.length) rows.append(el("tr", {}, el("td", { colSpan: 7, className: "empty",
    textContent: "This user has no memories." })));
}

async function run(button, label, fn) {
  const user = $("user").value;
  button.disabled = true;
  setStatus(`${label}…`);
  try { setStatus(await fn(user)); }
  catch (e) { setStatus(`Failed: ${e.message}`); }
  finally { button.disabled = false; await loadUsers(user); }
}

$("user").onchange = loadMemories;
$("consolidate").onclick = () => run($("consolidate"), "Consolidating", async (user) => {
  const r = await api(`/users/${encodeURIComponent(user)}/memories/consolidate`,
                      { method: "POST" });
  return r.groups.length
    ? `Merged ${r.groups.length} group(s): ${r.memories_before} → ${r.memories_after} memories.`
    : "Nothing similar enough to merge.";
});
$("expire").onclick = () => run($("expire"), "Expiring", async (user) => {
  const r = await api(`/users/${encodeURIComponent(user)}/memories/expire`, { method: "POST" });
  return r.expired ? `Expired ${r.expired} stale memories.` : "No memories have decayed enough to expire.";
});
$("forget").onclick = () => {
  const user = $("user").value;
  if (!confirm(`Delete every memory for "${user}"? This cannot be undone.`)) return;
  run($("forget"), "Deleting", async () => {
    const r = await api(`/users/${encodeURIComponent(user)}/memories`, { method: "DELETE" });
    return `Deleted ${r.deleted} memories for ${user}.`;
  });
};

loadUsers().catch((e) => setStatus(`Could not load memories: ${e.message}`));
</script>
</body>
</html>
